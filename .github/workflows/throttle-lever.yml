name: Senryou throttle lever checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: senryou-throttle-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  ui-only:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/senryou-ui-only-context-fix-20261008' && github.event.pull_request.base.ref == 'main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/senryou-ui-only-followup-20261010' && github.event.pull_request.base.ref == 'main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/senryou-ui-labels-20261011' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normal unit tests
        run: npm test
      - name: Normal type check and production build
        run: npm run build
      - name: Generate pinned product UI modules
        env:
          UI_ONLY_EVIDENCE_DIR: ${{ runner.temp }}/senryou-ui-only-evidence
        run: node browser-tests/ui-only/check-fixture.mjs
      - name: Strict type check for the UI-only fixture
        run: npx tsc --noEmit --project tsconfig.ui-only.json
      - name: Validate fixture Vite transforms
        env:
          UI_ONLY_EVIDENCE_DIR: ${{ runner.temp }}/senryou-ui-only-evidence
        run: node browser-tests/ui-only/validate-vite.mjs
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Capture bounded product UI states
        env:
          UI_ONLY_EVIDENCE_DIR: ${{ runner.temp }}/senryou-ui-only-evidence
        run: node browser-tests/ui-only/capture.mjs
      - name: Preserve UI-only screenshots and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senryou-ui-only-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/senryou-ui-only-evidence/
          retention-days: 7
          if-no-files-found: warn
  verify:
    # This complements the UI-only job above. Only the same-repo dedicated branch
    # targeting main skips this legacy gameplay/GPU workload.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'codex/senryou-ui-only-context-fix-20261008' || github.event.pull_request.base.ref != 'main') && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'codex/senryou-ui-only-followup-20261010' || github.event.pull_request.base.ref != 'main') && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'codex/senryou-ui-labels-20261011' || github.event.pull_request.base.ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 71b0e5bc9ffbe2cbd1f295160b9e8e3c40ad6650
          path: throttle-baseline
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: throttle-baseline
      - run: npm test
      - run: npm run build
      - id: install-browsers
        run: npx playwright install --with-deps chromium webkit
      # Preserve inherited PR #3 evidence before the unchanged smoke tests write fresh output.
      - name: Separate inherited smoke evidence from final-head output
        id: fresh-smoke-evidence
        run: mv docs/evidence/smoke "$RUNNER_TEMP/senryou-inherited-smoke"
      - name: Candidate browser checks (required)
        id: candidate-browser
        run: |
          if [ "${{ github.event.pull_request.number }}" = '5' ] && [ "$GITHUB_RUN_ATTEMPT" = '1' ] && [ "$(git show -s --format=%s HEAD)" = 'diagnostic: capture required native stop 20261007 once' ]; then
            node diagnostics/native-stop/run-required.mjs
          else
            npm run test:browser -- --config=playwright.throttle.config.ts
          fi
        env:
          THROTTLE_BASELINE_DIR: ${{ github.workspace }}/throttle-baseline
      # This pinned historical checkout already fails PC smoke with SwiftShader.
      # Keep its failure as comparison evidence; candidate checks above remain mandatory.
      - name: Pinned baseline smoke comparison (diagnostic)
        id: baseline-browser
        continue-on-error: true
        if: always() && steps.install-browsers.outcome == 'success'
        working-directory: throttle-baseline
        run: |
          mv docs/evidence/smoke "$RUNNER_TEMP/senryou-baseline-inherited-smoke"
          test ! -e playwright.throttle-baseline-smoke.config.ts
          cp ../playwright.baseline-smoke.config.ts playwright.throttle-baseline-smoke.config.ts
          npm run test:browser -- --config=playwright.throttle-baseline-smoke.config.ts
        env:
          THROTTLE_BASELINE_DIR: ${{ github.workspace }}/throttle-baseline
      - name: Record candidate and baseline smoke observations
        if: always() && steps.install-browsers.outcome == 'success'
        run: node scripts/summarize-throttle-smoke.mjs
        env:
          CANDIDATE_BROWSER_OUTCOME: ${{ steps.candidate-browser.outcome }}
          BASELINE_BROWSER_OUTCOME: ${{ steps.baseline-browser.outcome }}
      - name: Preserve final-head browser evidence
        if: always() && steps.fresh-smoke-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senryou-throttle-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
          path: |
            native-stop-evidence/
            test-results/
            docs/evidence/smoke/
            throttle-baseline/test-results/
            throttle-baseline/docs/evidence/smoke/
          retention-days: 7
          if-no-files-found: warn
